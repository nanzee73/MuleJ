# Builds MuleJ for Linux, Windows and macOS.
#  - Push a tag like v1.0.0 (or create a release with a new tag on GitHub): all packages are built
#    and attached to that release.
#  - Every push to main that changes code or build files: all packages are built and the pre-release
#    "Development build" (tag latest-dev) is replaced by them. README or other doc changes build nothing.
#  - "Run workflow" on the Actions tab: test build, packages are available as workflow artifacts.
#    With "release" set to an existing release tag (e.g. v1.0.0), the files are built from main and attached to
#    that release – for releases created on GitHub for a tag that already existed.
#
# File names (the same scheme as FlipperJ):
#   MuleJ-<version>-<platform>.msi / .dmg / .deb      installer with bundled Java
#   MuleJ-<version>-<platform>-portable.zip / .tar.gz  portable app folder with bundled Java (Windows, Linux)
#   MuleJ-<version>-all-platforms-java17.zip           start scripts bin/mulej and bin/mulej.bat, needs Java 17+
#   MuleJ-<version>-all-platforms-java17.jar           single jar (java -jar), needs Java 17+
# <platform>: linux-x64, windows-x64, windows-x86 (32-bit), macos-arm64 (Apple Silicon), macos-x64 (Intel)
name: Build & Release

on:
  push:
    tags: ['v*']                 # path filters below are not applied to tags
    branches: [main]
    paths:                       # only code and build changes make a new development build
      - 'src/**'
      - 'packaging/**'
      - 'gradle/**'
      - 'gradlew*'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'LICENSE'
      - 'THIRD-PARTY-NOTICES.md'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Existing release tag to build and fill with files, e.g. v1.0.0 (empty = test build only)'
        required: false

# a newer push to main cancels a development build that is still running
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
          - os: windows-latest
            label: windows-x64
          - os: windows-latest
            label: windows-x86      # 32-bit Windows: Temurin ships 32-bit Java only up to 17
            java: '17'
            arch: x86
            heap: 1g                # a 32-bit Java cannot reserve much more
          - os: macos-latest
            label: macos-arm64      # Apple Silicon
          - os: macos-15-intel
            label: macos-x64        # Intel Macs
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java || '21' }}
          architecture: ${{ matrix.arch || 'x64' }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        run: |
          # release tag: the pushed tag, or the existing release chosen when starting the workflow by hand
          T="${{ github.event.inputs.release }}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then T="$GITHUB_REF_NAME"; fi
          if [[ -n "$T" ]]; then
            V="${T#v}"; F="$V"; D="$V"
          else
            V="$(grep '^version' build.gradle.kts | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | tail -1)"
            F="dev"; D="dev-${GITHUB_SHA::7}"
          fi
          echo "RELEASE_TAG=$T" >> "$GITHUB_ENV"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          echo "FILE_VERSION=$F" >> "$GITHUB_ENV"       # in file names: version of the release, otherwise "dev"
          echo "DISPLAY_VERSION=$D" >> "$GITHUB_ENV"    # shown in the title bar and the About box
          echo "Building version $V"

      - name: Tools for .deb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: WiX Toolset (needed for the Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --no-progress -y
            $wix = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter "WiX Toolset*" | Select-Object -First 1
            "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Tests
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew --no-daemon -PappVersion=$APP_VERSION test 2>&1 | tee gradle.log; then
            grep -E "What went wrong|e: |error:|FAILED|Exception|> " gradle.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - name: Jar and zip with start scripts (need installed Java 17+)
        if: runner.os == 'Linux'
        run: |
          ./gradlew --no-daemon -PappVersion=$APP_VERSION shadowJar distZip
          mkdir -p dist-all
          cp "build/libs/mulej-$APP_VERSION-all.jar" "dist-all/MuleJ-$FILE_VERSION-all-platforms-java17.jar"
          cp "build/distributions/mulej-$APP_VERSION.zip" "dist-all/MuleJ-$FILE_VERSION-all-platforms-java17.zip"

      - name: Installer with bundled Java
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon -PappVersion=$APP_VERSION -PmaxHeap=${{ matrix.heap || '' }} jpackage 2>&1 | tee jpackage.log; then
            # make the reason visible as annotations
            grep -E "What went wrong|rror|Exception|skipped|Advice|> " jpackage.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          mkdir -p dist
          for f in build/installer/*.dmg build/installer/*.msi build/installer/*.deb; do
            [ -e "$f" ] || continue
            ext="${f##*.}"
            mv "$f" "dist/MuleJ-$FILE_VERSION-${{ matrix.label }}.$ext"
          done

      - name: Portable app folder with bundled Java (Linux, Windows)
        if: runner.os != 'macOS'
        run: |
          ./gradlew --no-daemon -PappVersion=$APP_VERSION -PmaxHeap=${{ matrix.heap || '' }} -PinstallerType=app-image jpackage
          cd build/installer
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z a -tzip "../../dist/MuleJ-$FILE_VERSION-${{ matrix.label }}-portable.zip" MuleJ > /dev/null
          else
            tar czf "../../dist/MuleJ-$FILE_VERSION-${{ matrix.label }}-portable.tar.gz" MuleJ
          fi

      - name: List packages
        run: ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: MuleJ-${{ env.FILE_VERSION }}-${{ matrix.label }}
          path: dist/*

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: MuleJ-${{ env.FILE_VERSION }}-all-platforms-java17
          path: dist-all/*

      - name: Attach to release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/*
            dist-all/*
          generate_release_notes: true

  dev-release:
    name: Development build release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Remove the previous development build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete latest-dev --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-dev
          target_commitish: ${{ github.sha }}
          name: Development build
          prerelease: true
          make_latest: false
          body: |
            Automatic build of the latest code on main (commit ${{ github.sha }}).
            Not an official version – for those see the releases with a version number.
          files: dist/*
