about.title=About MuleJ
about.text=MuleJ %s\nC64 graphics tools under one roof:\n• Palettize (formerly c64palettizer)\n• Pixelize 2×1 (formerly c64pixelizer)\n• C64 bitmap multicolor/hires with colour check (formerly c64koalaverter / c64imager)\n\nWithout arguments the GUI starts, with arguments the command line (mulej --help).

tool.label=Tool:
tool.PALETTIZE=Palettize
tool.PALETTIZE.tip=Replace every colour by the nearest C64 palette colour (optionally dithered) → NAME_palettized.png
tool.PIXELIZE=Pixelize 2×1
tool.PIXELIZE.tip=Make every two neighbouring pixels equal (multicolor pixels) → NAME_pixelized_l2r.png / _r2l.png
tool.BITMAP=C64 bitmap
tool.BITMAP.tip=Multicolor (Koala, .kla) or hires (Art Studio, .art) with colour check and correction

file.input=Input file:
file.output=Output file:
file.select=Select…
file.toC64=Bring to 320×200
file.toC64.tip=Crop larger pictures (choose a frame), scale up smaller ones. Always on for C64 bitmaps.
file.hint=Any picture format or a C64 file (.kla, .art).

pal.group=Palette & colour matching
pal.customButton=Custom…
pal.matchIn=Matching:
space.EUCLID=RGB euclidean (as before)
space.RGB=RGB weighted
space.YUV=YUV
space.HSL=HSL

pix.group=Pixel pairs (2×1)
pixel.L2R=Left → right
pixel.L2R.tip=The left pixel of every pair survives (even columns copied to the right)
pixel.R2L=Right → left
pixel.R2L.tip=The right pixel of every pair survives (odd columns copied to the left)
pixel.AVERAGE=Average
pixel.AVERAGE.tip=Both pixels get the average of the pair (usually nicest for photos)

dit.group=Dithering
dit.strength=Strength
dit.serpentine=Serpentine scanning
dit.bleeding=Bleeding (across cells)
dit.bleeding.tip=C64 bitmap: the dither error may continue into neighbouring cells
dither.NONE=No dithering
dither.FLOYD_STEINBERG=Floyd-Steinberg
dither.ATKINSON=Atkinson
dither.JARVIS=Jarvis-Judice-Ninke
dither.STUCKI=Stucki
dither.SIERRA_LITE=Sierra Lite
dither.BAYER2=Bayer 2×2 (ordered)
dither.BAYER4=Bayer 4×4 (ordered)
dither.BAYER8=Bayer 8×8 (ordered)

bmp.group=C64 bitmap
mode.MULTICOLOR=Multicolor
mode.MULTICOLOR.tip=160×200, per 4×8 cell 3 colours plus a shared background → Koala Painter (.kla)
mode.HIRES=Hires
mode.HIRES.tip=320×200, per 8×8 cell 2 colours → Art Studio (.art)
bmp.palettize=Palettize first
bmp.palettize.tip=Off: every pixel must already be exactly a palette colour (only check and correct finished pixel art)
bmp.background=Background:
bmp.bgAuto=Automatic (most common colour)
bmp.fix=Correct automatically
bmp.fix.tip=Cells with too many colours get the colours that reproduce them best (always on with dithering)
view.palAspect=PAL aspect ratio in preview

chk.group=Colour check & correction
chk.none=No result
chk.ok=✔ Colour check passed: all 1000 cells keep the %s rules
chk.okMc=✔ Colour check passed: all 1000 cells keep the %s rules (background %d)
chk.bad=✘ %d cells break the %s rules (max. %d colours per cell) – marked red
chk.conflict=Conflict:
chk.prev.tip=Show the previous cell with too many colours
chk.next.tip=Show the next cell with too many colours
chk.mark=Mark
chk.mark.tip=Red: breaks the rules · yellow: corrected · cyan: selected cell (preview only, never in files)
chk.click=Click into result:
chk.select=Select cell
chk.select.tip=A left click into the result selects the cell; its colours appear below
chk.paint=Paint
chk.paint.tip=Left click / drag into the result sets pixels to the chosen colour
chk.cell=Cell %d/%d: %d of max. %d colours
chk.noCell=No cell selected
chk.bgShort=BG
chk.swatch.tip=%d %s – %d pixels in this cell
chk.apply=Apply colours
chk.apply.tip=The cell may only use the pressed colours (plus background); every pixel gets the nearest of them
chk.auto=Automatic
chk.auto.tip=Choose the colours that reproduce this cell best
chk.resetCell=Reset cell
chk.resetCell.tip=Discard the manual colours and painted pixels of this cell
chk.resetAll=Discard all corrections
chk.resetAll.tip=Discard all manual cell colours and painted pixels
chk.hint=Click a cell with “Select cell” or jump to a conflict with ◀ ▶.
chk.hintCell=Press up to %d colours and apply.
chk.hintCellMc=Press up to %d colours (BG = background, always allowed) and apply.
chk.tooMany=%d colours chosen – at most %d are allowed.

