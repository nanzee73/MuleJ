about.title=About MuleJ
about.text=MuleJ %s\nTurns any picture into C64 graphics: multicolor (Koala), hires (Art Studio) or PETSCII (Petmate),\neach also as runnable PRG. Successor of c64palettizer, c64pixelizer and c64koalaverter.\n\nWithout arguments the GUI starts, with arguments the command line (mulej --help).

top.target=Target:
target.MULTICOLOR=Multicolor
target.MULTICOLOR.tip=160×200, per 4×8 cell 3 colours plus a shared background → Koala Painter (.kla)
target.HIRES=Hires
target.HIRES.tip=320×200, per 8×8 cell 2 colours → Art Studio (.art)
target.PETSCII=PETSCII
target.PETSCII.tip=Text screen: per 8×8 cell one character and one colour plus a shared background → Petmate
top.open=Open picture…
