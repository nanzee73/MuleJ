about.title=About MuleJ
about.text=MuleJ %s\nby nanzee@chocotrophy\n\nTurns any picture into C64 graphics: multicolour (Koala), hires (Art Studio), PETSCII (Petmate)\nor a character set with screen and meta tiles for demo effects (KickAssembler), each also as runnable PRG.\nSuccessor of c64palettizer, c64pixelizer and c64koalaverter.\n\nWithout arguments the GUI starts, with arguments the command line (mulej --help).

