about.title=About MuleJ
about.text=MuleJ %s\nC64 graphics tools under one roof:\n• Palettize (formerly c64palettizer)\n• Pixelize 2×1 (formerly c64pixelizer)\n• Koala export (formerly c64koalaverter / c64imager)\n\nWithout arguments the GUI starts, with arguments the command line (mulej --help).

tool.label=Tool:
tool.PALETTIZE=Palettize
tool.PALETTIZE.tip=Replace every colour by the nearest C64 palette colour → NAME_palettized.png
tool.PIXELIZE=Pixelize 2×1
tool.PIXELIZE.tip=Make every two neighbouring pixels equal (multicolor pixels) → NAME_pixelized_l2r.png / _r2l.png
tool.KOALA=Koala
tool.KOALA.tip=Turn a 320×200 picture into a Koala Painter file → NAME.kla

