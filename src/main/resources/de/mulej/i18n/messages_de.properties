about.title=Über MuleJ
about.text=MuleJ %s\nvon nanzee@chocotrophy\n\nWandelt beliebige Bilder in C64-Grafik: Multicolor (Koala), Hires (Art Studio) oder PETSCII (Petmate),\njeweils auch als startbare PRG. Nachfolger von c64palettizer, c64pixelizer und c64koalaverter.\n\nOhne Argumente startet die Oberfläche, mit Argumenten die Kommandozeile (mulej --help).

