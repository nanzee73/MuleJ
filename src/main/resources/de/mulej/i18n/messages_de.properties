about.text=MuleJ %s\nC64-Grafikwerkzeuge unter einer Oberfläche:\n• Palettieren (früher c64palettizer)\n• Pixelisieren 2×1 (früher c64pixelizer)\n• Koala-Export (früher c64koalaverter / c64imager)\n\nOhne Argumente startet die Oberfläche, mit Argumenten die Kommandozeile (mulej --help).

