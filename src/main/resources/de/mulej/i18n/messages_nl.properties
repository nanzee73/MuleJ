about.text=MuleJ %s\ndoor nanzee@chocotrophy\n\nZet elke afbeelding om naar C64-graphics: multicolor (Koala), hires (Art Studio), PETSCII (Petmate)\nof een tekenset met scherm en metategels voor demo-effecten (KickAssembler), telkens ook als startbaar PRG.\nOpvolger van c64palettizer, c64pixelizer en c64koalaverter.\n\nZonder argumenten start de grafische interface, met argumenten de opdrachtregel (mulej --help).
