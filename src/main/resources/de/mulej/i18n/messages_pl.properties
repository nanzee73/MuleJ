about.text=MuleJ %s\nautor: nanzee@chocotrophy\n\nZamienia dowolny obraz na grafikę C64: multicolor (Koala), hires (Art Studio), PETSCII (Petmate)\nlub zestaw znaków z ekranem i metakafelkami do efektów w demach (KickAssembler), zawsze także jako uruchamialny PRG.\nNastępca c64palettizer, c64pixelizer i c64koalaverter.\n\nBez argumentów uruchamia się interfejs graficzny, z argumentami wiersz poleceń (mulej --help).
