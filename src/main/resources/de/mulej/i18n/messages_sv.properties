about.text=MuleJ %s\nav nanzee@chocotrophy\n\nGör om vilken bild som helst till C64-grafik: multicolor (Koala), hires (Art Studio), PETSCII (Petmate)\neller en teckenuppsättning med skärm och metabrickor för demoeffekter (KickAssembler), alltid även som körbar PRG.\nEfterföljare till c64palettizer, c64pixelizer och c64koalaverter.\n\nUtan argument startar det grafiska gränssnittet, med argument kommandoraden (mulej --help).
